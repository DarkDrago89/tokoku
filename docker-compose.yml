services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tokoku
      POSTGRES_PASSWORD: tokoku
      POSTGRES_DB: tokoku
    ports:
      - "5433:5432"
    volumes:
      - tokoku-data:/var/lib/postgresql/data
      # Membuat database tokoku_test untuk pengujian (hanya saat volume pertama kali dibuat)
      - ./prisma/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  tokoku-data:
